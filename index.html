<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Konsep Generic & OOP pada Dart </title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* GOOGLE FONTS */
@import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Space+Mono:wght@400;700&display=swap');

body {
    font-family: 'Inter', sans-serif;
    background: #03050b;
    color: #00f3ff;
    min-height: 100vh;
    position: relative;
}

/* BACKGROUND - CYBERPUNK GRID */
.cyber-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    background: radial-gradient(circle at 20% 30%, #0a0a2a, #020108);
}

.cyber-bg::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background-image: 
        linear-gradient(rgba(0, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
}

.cyber-bg::after {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(ellipse at center, rgba(255,0,255,0.05) 0%, rgba(0,0,0,0) 70%);
    pointer-events: none;
}

/* GLOWING TEXT ANIMATION */
.glitch-text {
    animation: glitch 3s infinite;
}

@keyframes glitch {
    0%, 100% { text-shadow: 0 0 5px #00f3ff, 0 0 10px #ff00de; }
    95% { text-shadow: 0 0 2px #00f3ff; }
    96% { text-shadow: -2px 0 #ff00de, 2px 0 #00f3ff; }
    97% { text-shadow: 2px 0 #ff00de, -2px 0 #00f3ff; }
}

/* FALLING CODE ANIMATION - CYBER VIBE */
.falling-codes {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    opacity: 0.25;
}

.falling-codes span {
    position: absolute;
    color: #ff00de;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    animation: fall linear infinite;
    filter: drop-shadow(0 0 3px #00f3ff);
}

@keyframes fall {
    from { transform: translateY(-100vh); opacity: 1; }
    to { transform: translateY(100vh); opacity: 0; }
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 30px 20px;
    position: relative;
    z-index: 1;
}

/* ========== HEADER ========== */
.header {
    background: rgba(5, 7, 20, 0.85);
    backdrop-filter: blur(12px);
    border-radius: 32px;
    padding: 50px 30px;
    text-align: center;
    margin-bottom: 30px;
    border: 2px solid #00f3ff;
    box-shadow: 0 0 30px rgba(0, 243, 255, 0.3), inset 0 0 20px rgba(255, 0, 222, 0.1);
    position: relative;
    overflow: hidden;
}

.header::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 0deg, transparent, #00f3ff, #ff00de, transparent);
    opacity: 0.1;
    animation: rotate 8s linear infinite;
    pointer-events: none;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.header h1 {
    font-size: clamp(2rem, 6vw, 3.5rem);
    font-weight: 800;
    background: linear-gradient(135deg, #00f3ff, #ff00de, #00f3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    margin: 5px 0;
    filter: drop-shadow(0 0 15px rgba(0,243,255,0.5));
}

.header .amp {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    background: linear-gradient(135deg, #ff00de, #00f3ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.header-divider {
    width: 120px;
    height: 4px;
    background: linear-gradient(90deg, transparent, #00f3ff, #ff00de, transparent);
    margin: 25px auto;
    border-radius: 3px;
    box-shadow: 0 0 10px #00f3ff;
}

.identity {
    margin-top: 10px;
}

.identity p {
    font-size: 1.2rem;
    font-weight: 500;
    color: #ff00de;
    text-shadow: 0 0 10px rgba(255, 0, 222, 0.5);
    margin: 5px 0;
}

.identity p:first-child {
    font-size: 1.4rem;
    font-weight: 700;
    background: linear-gradient(135deg, #00f3ff, #ff00de);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* ========== SECTION CARD ========== */
.section {
    background: rgba(5, 7, 20, 0.75);
    backdrop-filter: blur(8px);
    border-radius: 24px;
    padding: 30px;
    margin-bottom: 25px;
    border: 1px solid rgba(0, 243, 255, 0.4);
    transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    position: relative;
    overflow: hidden;
}

.section::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, #00f3ff, #ff00de);
    transform: scaleX(0);
    transition: transform 0.5s ease;
    transform-origin: left;
}

.section:hover::after {
    transform: scaleX(1);
}

.section:hover {
    transform: translateY(-5px);
    border-color: #ff00de;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), 0 0 30px rgba(0, 243, 255, 0.2);
    background: rgba(5, 7, 20, 0.9);
}

.section h2 {
    font-size: 1.8rem;
    font-weight: 700;
    background: linear-gradient(135deg, #00f3ff, #ff00de);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 20px;
    letter-spacing: -0.3px;
}

.section h2::after {
    content: "";
    display: block;
    width: 70px;
    height: 3px;
    background: linear-gradient(90deg, #00f3ff, #ff00de);
    margin-top: 10px;
    border-radius: 3px;
    box-shadow: 0 0 8px #00f3ff;
}

.section h3 {
    font-size: 1.3rem;
    font-weight: 600;
    color: #ff00de;
    margin: 20px 0 12px 0;
    text-shadow: 0 0 5px #ff00de;
}

.section p {
    color: #b8f2ff;
    line-height: 1.7;
    margin-bottom: 15px;
    font-weight: 400;
}

.section ul {
    margin-left: 25px;
    margin: 15px 0;
}

.section li {
    color: #a0f5ff;
    margin-bottom: 10px;
    line-height: 1.6;
}

/* ========== CODE BOX ========== */
.code-box {
    background: #010105;
    border-radius: 16px;
    padding: 20px;
    margin: 20px 0;
    border: 1px solid #00f3ff;
    overflow-x: auto;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 15px rgba(0,243,255,0.1);
}

.code-box pre {
    margin: 0;
    white-space: pre-wrap;
    word-wrap: break-word;
}

.code-box code {
    font-family: 'Space Mono', 'Courier New', monospace;
    font-size: 13px;
    color: #ff9ff3;
    line-height: 1.6;
}

/* ========== BUTTON ========== */
.btn-group {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 15px;
}

.btn {
    padding: 10px 28px;
    border-radius: 40px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    border: none;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary {
    background: linear-gradient(135deg, #00b4d8, #0077b6);
    color: #fff;
    box-shadow: 0 0 10px #00b4d8;
}

.btn-primary:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00f3ff, 0 4px 20px rgba(0, 180, 216, 0.5);
    background: linear-gradient(135deg, #00f3ff, #00b4d8);
    color: #000;
}

.btn-secondary {
    background: rgba(255, 0, 222, 0.15);
    border: 1px solid #ff00de;
    color: #ff00de;
}

.btn-secondary:hover {
    background: rgba(255, 0, 222, 0.3);
    transform: scale(1.02);
    box-shadow: 0 0 15px rgba(255, 0, 222, 0.3);
}

/* ========== GAMBAR ========== */
.vscode-image {
    margin-top: 18px;
    max-width: 100%;
    height: auto;
    border-radius: 16px;
    border: 2px solid #00f3ff;
    box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
    cursor: pointer;
    transition: all 0.3s ease;
}

.vscode-image:hover {
    transform: scale(1.02);
    box-shadow: 0 0 35px rgba(255, 0, 222, 0.6);
    border-color: #ff00de;
}

/* ========== MODAL ========== */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background: rgba(0, 0, 0, 0.98);
    backdrop-filter: blur(12px);
    cursor: pointer;
}

.modal-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    max-width: 90%;
    max-height: 90%;
}

.modal-content img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 20px;
    border: 3px solid #00f3ff;
    box-shadow: 0 0 60px rgba(0, 243, 255, 0.5);
}

.close-modal {
    position: absolute;
    right: 35px;
    top: 25px;
    font-size: 45px;
    color: #00f3ff;
    cursor: pointer;
    transition: 0.3s;
    z-index: 1001;
}

.close-modal:hover {
    transform: scale(1.2);
    color: #ff00de;
    text-shadow: 0 0 15px #00f3ff;
}

/* ========== SUMMARY BOX ========== */
.summary-box {
    background: linear-gradient(135deg, rgba(0, 243, 255, 0.1), rgba(255, 0, 222, 0.1));
    border-radius: 24px;
    padding: 30px;
    margin-top: 20px;
    margin-bottom: 20px;
    border: 1px solid #ff00de;
    backdrop-filter: blur(4px);
}

.summary-box p {
    font-size: 1.3rem;
    font-weight: bold;
    color: #00f3ff;
    margin-bottom: 15px;
}

.summary-box li {
    color: #ffb3f0;
}

/* ========== FOOTER ========== */
.footer {
    text-align: center;
    padding: 30px;
    margin-top: 40px;
    border-top: 1px solid rgba(0, 243, 255, 0.3);
    color: #6a6aff;
    font-size: 0.9rem;
}

.footer p {
    margin: 5px 0;
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar {
    width: 8px;
}

::-webkit-scrollbar-track {
    background: #010105;
    border-radius: 10px;
}

::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #00b4d8, #ff00de);
    border-radius: 10px;
}

::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(135deg, #00f3ff, #ff66cc);
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
    .container {
        padding: 15px;
    }
    .section {
        padding: 20px;
    }
    .section h2 {
        font-size: 1.5rem;
    }
    .btn {
        padding: 8px 18px;
        font-size: 12px;
    }
    .header {
        padding: 30px 20px;
    }
}

.button {
    background: linear-gradient(135deg, #ff00de, #00f3ff);
    border: none;
    padding: 12px 28px;
    border-radius: 40px;
    font-weight: bold;
    cursor: pointer;
    margin: 15px 0;
    color: #000;
    font-weight: 700;
    transition: all 0.3s ease;
}

.button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00f3ff;
}
</style>

<script>
// FALLING CODE ANIMATION - CYBER VERSION
function createFallingCodes() {
    const container = document.querySelector('.falling-codes');
    if (!container) return;
    
    const chars = ['0', '1', 'class', 'void', 'main', 'extends', 'final', 'sealed', 'abstract', 'mixins', '=>', '{}', '()', '[]', 'if', 'else', 'return', 'new', 'CYBER', 'NEON'];
    
    for (let i = 0; i < 60; i++) {
        const span = document.createElement('span');
        span.textContent = chars[Math.floor(Math.random() * chars.length)];
        span.style.left = Math.random() * 100 + '%';
        span.style.animationDuration = Math.random() * 8 + 4 + 's';
        span.style.animationDelay = Math.random() * 10 + 's';
        span.style.opacity = Math.random() * 0.4 + 0.1;
        span.style.fontSize = Math.random() * 16 + 8 + 'px';
        container.appendChild(span);
    }
}

// TOGGLE IMAGE
function toggleImage(imgId) {
    const img = document.getElementById(imgId);
    if (!img) {
        console.error("Gambar tidak ditemukan:", imgId);
        return;
    }
    img.style.display = img.style.display === "none" || img.style.display === "" ? "block" : "none";
}

// MODAL FUNCTIONS
function openModal(imgId) {
    const img = document.getElementById(imgId);
    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImage");
    if (!img || !modal || !modalImg) return;
    modal.style.display = "block";
    modalImg.src = img.src;
}

function closeModal() {
    const modal = document.getElementById("imageModal");
    if (modal) modal.style.display = "none";
}

// INITIALIZATION
document.addEventListener("DOMContentLoaded", function() {
    createFallingCodes();
    
    const images = document.querySelectorAll('.vscode-image');
    images.forEach(img => {
        img.addEventListener('click', () => openModal(img.id));
    });
    
    console.log("🔥 Cyberpunk Theme Loaded!");
});

// CLICK OUTSIDE MODAL
window.onclick = function(e) {
    const modal = document.getElementById("imageModal");
    if (e.target === modal) closeModal();
}
</script>
</head>

<body>

<div class="cyber-bg"></div>
<div class="falling-codes"></div>

<div class="container">
